# CI only: typecheck, unit tests and builds. It never deploys anything.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/api
      - run: npx jest --ci
        working-directory: apps/api
        env:
          JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-0123456789
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npx tsc -p tsconfig.build.json --outDir dist-ci
        working-directory: apps/api
  api-db:
    # E1a exit criterion (doc 12 §3, doc 16 §5.1 C-2): the DB-backed tests (*.db-test.ts) on a migrated, empty scratch
    # database. PostgreSQL 18 + TimescaleDB 2.31.0 (production's versions) and Valkey 7.2 as service containers.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: timescale/timescaledb:2.31.0-pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: veetrax_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d veetrax_ci_test" --health-interval 5s --health-timeout 5s --health-retries 30
      valkey:
        image: valkey/valkey:7.2
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CI: 'true'
      # A missing or refused database fails the run instead of skipping the suites (apps/api/src/test/scratch-db.ts).
      DB_TEST_REQUIRED: '1'
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/veetrax_ci_test
      TEST_REDIS_URL: redis://localhost:6379/1
      ETMS_DB_TEST_URL: postgresql://ci:ci@localhost:5432/veetrax_ci_test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/veetrax_ci_test
      JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # doc 16 C-4: never anything but a *_test database (never veetracer, never veetrax_assess).
      - name: Refuse a non-test database
        run: |
          for url in "$DATABASE_URL" "$ETMS_DB_TEST_URL" "$TEST_DATABASE_URL"; do
            name="${url##*/}"; name="${name%%\?*}"
            case "$name" in
              *_test) echo "ok: $name" ;;
              *) echo "::error::refusing database '$name': only *_test databases are allowed in CI"; exit 1 ;;
            esac
          done
      - run: npm ci
      - run: npm run build:shared
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - name: TimescaleDB present
        run: test -n "$(PGPASSWORD=ci psql -h localhost -U ci -d veetrax_ci_test -tAc "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'")"
      # ETMS, shared-settings and E4 routing DB tests (routing-jobs, routing/usage: E4 QA B5). stock.db-test.ts needs its
      # own throw-away database and is not in this job yet.
      - run: npx jest --ci --runInBand --testRegex 'src/(etms|common|routing-jobs|routing)/.*\.db-test\.ts$'
        working-directory: apps/api

  optimizer:
    # services/routing-optimizer (OR-Tools). Locked, hashed wheels from PyPI only; the tests use no network.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/routing-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
      - run: python -m pytest
        env:
          PYTHONDONTWRITEBYTECODE: '1'
  optimizer-int:
    # E4 QA B5: the API worker against the real OR-Tools service, started from the locked, hashed venv on loopback with
    # a throw-away token (optimizer-real.int-test.ts: contract v2, verification, pins, optimiser stopped, wrong token).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROUTING_OPTIMIZER_TEST_URL: http://127.0.0.1:18090
      # The suite fails instead of skipping when the URL / token are missing.
      OPTIMIZER_INT_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Optimiser venv (locked, hashed wheels only)
        working-directory: services/routing-optimizer
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
      - name: Start the optimiser on 127.0.0.1:18090 with a random token
        working-directory: services/routing-optimizer
        run: |
          token="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$token"
          echo "ROUTING_OPTIMIZER_TEST_TOKEN=$token" >> "$GITHUB_ENV"
          OPTIMIZER_TOKEN="$token" OPTIMIZER_CONCURRENCY=2 nohup .venv/bin/python -m optimizer.server --host 127.0.0.1 --port 18090 > optimizer.log 2>&1 &
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/health || true)"
            [ "$code" = 401 ] && exit 0
            sleep 1
          done
          cat optimizer.log
          exit 1
      - run: npm ci
      - run: npm run build:shared
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx jest --ci --runInBand --testRegex 'optimizer-real\.int-test\.ts$'
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npx tsc -b --noEmit
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npx vite build --outDir dist-ci
        working-directory: apps/web
      # G8: no outside map style / tile / glyph host in the bundle or source (built without VITE_MAP_STYLE_*).
      - run: node scripts/check-no-external-maps.mjs apps/web/dist-ci
