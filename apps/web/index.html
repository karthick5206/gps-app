<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0E5E57" />
    <meta name="description" content="VeeTrax: live fleet tracking with alerts, trips, drivers and reports for every vehicle." />
    <meta property="og:title" content="VeeTrax: live fleet tracking" />
    <meta property="og:description" content="Alerts, trips, drivers and reports for every vehicle. Web, Android and iOS." />
    <meta property="og:image" content="/og-image.png" />
    <title>VeeTrax</title>
    <script>
      // Apply the stored theme before first paint to avoid a colour flash (ids: THEMES in @veetracer/shared).
      (function () {
        try {
          var pref = localStorage.getItem('vt.theme');
          if (['teal', 'plum', 'sky', 'light', 'dark'].indexOf(pref) < 0) pref = 'teal';
          var dark = pref === 'dark';
          document.documentElement.dataset.theme = pref;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
