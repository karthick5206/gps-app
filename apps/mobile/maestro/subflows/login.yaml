# Signs in with e-mail + password. Params: EMAIL, PASSWORD (synthetic accounts only).
# Selectors are testIDs (login.tsx): the "Email" / "Password" texts are labels, tapping them types nothing.
# No hideKeyboard: on Android it presses BACK, which closes the app from the sign-in screen. The password field submits
# on the keyboard's Go key instead (onSubmitEditing), so the Sign in button behind the keyboard is never needed.
appId: ${APP_ID || "com.sasvata.veetrax"}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 60000
- tapOn: "Email & password"
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
# Some keyboards (Gboard with its toolbar on a 1080x2400 screen) cover the password field. Only then press BACK: with
# the keyboard open, BACK closes the keyboard and never reaches the app.
- runFlow:
    when:
      notVisible:
        id: "login-password"
    commands:
      - pressKey: back
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    notVisible:
      id: "login-email"
    timeout: 30000
