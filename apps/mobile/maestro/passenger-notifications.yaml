# Passenger inbox (D7 / L4): the in-app history is authoritative; push only wakes the app. After a dispatcher or
# driver change the passenger sees a generic notice and opens the trip from it.
appId: ${APP_ID || "com.sasvata.veetrax"}
env:
  EMAIL: ${PASSENGER_EMAIL}
  PASSWORD: ${PASSENGER_PASSWORD}
tags:
  - etms
  - passenger
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "(?i)next trip"
    timeout: 30000
- tapOn: "Notices"
- extendedWaitUntil:
    visible: "Your trip starts soon"
    timeout: 20000
# The newest notice is the top match; the same text further down is the push preference switch (tapping that
# turned the preference off in the R1151 run), so tap the first match only.
- tapOn:
    text: "Your trip starts soon"
    index: 0
- extendedWaitUntil:
    visible: "Estimated pickup"
    timeout: 15000
