# Passenger journey (doc 08; doc 11 §2.2 E5): commute home → today's trip → trip screen (pickup, ETA, vehicle only
# inside the window, co-riders never named) → bookings. Needs a passenger login seated on a trip today.
appId: ${APP_ID || "com.sasvata.veetrax"}
env:
  EMAIL: ${PASSENGER_EMAIL}
  PASSWORD: ${PASSENGER_PASSWORD}
tags:
  - etms
  - passenger
---
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "(?i)next trip"
    timeout: 30000
# The SOS panel sits above the trip list during a trip, so the privacy line is below the fold.
- scrollUntilVisible:
    element: "VeeTrax does not track your phone. The vehicle is shown only around your trip."
    direction: DOWN
- assertNotVisible: "No passenger profile"
- scrollUntilVisible:
    element: "My pickup: .*"
    direction: UP
- tapOn: "My pickup: .*"
# "Estimated pickup" needs a started trip whose vehicle has reported a fix (drive it with uat sim-uat.ts / etms:sim-trip).
- extendedWaitUntil:
    visible: "Estimated pickup"
    timeout: 15000
- assertVisible: "Driver"
- scrollUntilVisible:
    element: "Call transport desk"
    direction: DOWN
- back
- tapOn: "My bookings"
- assertNotVisible: "No passenger profile"
